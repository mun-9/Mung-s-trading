<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root { --text: #191F28; --sub: #8B95A1; --soft: #F2F4F6; --card: #fff; --blue: #3182F6; --shadow: 0 2px 14px rgba(15,23,42,0.05); }
:root[data-theme="dark"] { --text: #ECEEF2; --sub: #8A93A2; --soft: #20252D; --card: #171B22; --blue: #5B8DFF; --shadow: 0 2px 14px rgba(0,0,0,0.35); }
* { box-sizing: border-box; }
html, body { margin: 0; background: transparent; color: var(--text); font-family: 'Pretendard', -apple-system, sans-serif; letter-spacing: -0.01em; }
.card { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); padding: 20px 24px 22px; }
.head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.head b { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }
.head span { font-size: 12.5px; color: var(--sub); }
.desc { font-size: 12.5px; color: var(--sub); margin-bottom: 14px; }
.body { display: grid; grid-template-columns: 300px 1fr; gap: 22px; align-items: start; }
canvas { width: 100%; border-radius: 16px; display: block; box-shadow: 0 10px 30px rgba(0,0,0,.18); }
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 12px 14px; background: var(--soft); border-radius: 12px; font-size: 13.5px; font-weight: 650; }
.sw { position: relative; width: 44px; height: 26px; border-radius: 13px; background: rgba(139,149,161,.4); cursor: pointer; transition: background .2s; flex-shrink: 0; }
.sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; transition: transform .2s; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
.sw.on { background: var(--blue); } .sw.on::after { transform: translateX(18px); }
.thm { display: flex; gap: 6px; }
.thm button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
.thm button.on { border-color: var(--blue); }
.btns { display: flex; gap: 8px; margin-top: 4px; }
.btns button { flex: 1; height: 46px; border: 0; border-radius: 12px; font-family: inherit; font-size: 14.5px; font-weight: 800; cursor: pointer; }
.btns .pri { background: var(--blue); color: #fff; } .btns .sec { background: var(--soft); color: var(--text); }
.hint { font-size: 12px; color: var(--sub); line-height: 1.55; }
@media (max-width: 700px) { .body { grid-template-columns: 1fr; } .card { padding: 16px; } canvas { max-width: 360px; margin: 0 auto; } }
</style>
</head>
<body>
<div class="card">
  <div class="head"><b>📸 수익 인증 카드</b><span id="per"></span></div>
  <div class="desc">선택한 기간의 성과를 인스타 비율(4:5) 이미지로 만들어요.</div>
  <div class="body">
    <canvas id="cv" width="1080" height="1350"></canvas>
    <div class="opts">
      <div class="opt">금액 숨기기 (수익률만 표시)<div class="sw" id="swHide"></div></div>
      <div class="opt">누적 손익 그래프<div class="sw on" id="swChart"></div></div>
      <div class="opt">카드 색<div class="thm" id="thm"><button data-t="midnight" style="background:linear-gradient(135deg,#0E1424,#1B2A55)"></button><button data-t="ocean" style="background:linear-gradient(135deg,#0B3B7A,#2459ED)"></button><button data-t="sunset" style="background:linear-gradient(135deg,#3A1C71,#D76D77)"></button><button data-t="mono" style="background:#F2F4F6"></button></div></div>
      <div class="btns"><button class="pri" id="save">이미지 저장</button><button class="sec" id="share">공유하기</button></div>
      <div class="hint">휴대폰에서는 ‘공유하기’로 인스타·카톡에 바로 보낼 수 있어요. 저장이 안 되면 이미지를 길게 눌러 저장하세요.</div>
    </div>
  </div>
</div>
<script>
const D = __DATA__;
const $ = id => document.getElementById(id);
const PD = window.parent.document, MQ = matchMedia('(prefers-color-scheme: dark)');
function siteDark() { let t = null; try { t = PD.documentElement.getAttribute('data-mg-theme'); } catch (e) {} return t ? t === 'dark' : MQ.matches; }
function syncTheme() { document.documentElement.setAttribute('data-theme', siteDark() ? 'dark' : 'light'); }
syncTheme(); try { new MutationObserver(syncTheme).observe(PD.documentElement, { attributes: true, attributeFilter: ['data-mg-theme'] }); } catch (e) {}
function _fitFrame(fe, h) { fe.style.height = h + 'px'; fe.height = h; let n = fe.parentElement; for (let i = 0; i < 4 && n; i++, n = n.parentElement) { n.style.height = h + 'px'; n.style.minHeight = h + 'px'; n.style.flex = '0 0 ' + h + 'px'; if (n.getAttribute && n.getAttribute('data-testid') === 'stElementContainer') break; } }
function fit() { try { const h = Math.ceil(document.body.getBoundingClientRect().height) + 4, fe = window.frameElement; if (fe && (Math.abs(fe.offsetHeight - h) > 2 || (fe.parentElement && Math.abs(fe.parentElement.offsetHeight - h) > 2))) _fitFrame(fe, h); } catch (e) {} }
new ResizeObserver(fit).observe(document.body); setInterval(fit, 1500);

let S = { hide: false, chart: true, t: 'midnight' };
try { Object.assign(S, JSON.parse(localStorage.getItem('mung_share') || '{}')); } catch (e) {}
const save = () => { try { localStorage.setItem('mung_share', JSON.stringify(S)); } catch (e) {} };
$('per').textContent = D.period;
const TH = {
  midnight: { bg: ['#0B1020', '#16224A'], text: '#FFFFFF', sub: 'rgba(255,255,255,.6)', tile: 'rgba(255,255,255,.07)', up: '#2FD3A8', down: '#FF5C6C', acc: '#6E9BFF' },
  ocean: { bg: ['#06306B', '#2459ED'], text: '#FFFFFF', sub: 'rgba(255,255,255,.7)', tile: 'rgba(255,255,255,.12)', up: '#5CF2C9', down: '#FFB0B8', acc: '#BFD3FF' },
  sunset: { bg: ['#2B1458', '#C2566E'], text: '#FFFFFF', sub: 'rgba(255,255,255,.7)', tile: 'rgba(255,255,255,.12)', up: '#7CF5C8', down: '#FFD0D6', acc: '#FFE1A8' },
  mono: { bg: ['#FFFFFF', '#EEF1F5'], text: '#191F28', sub: '#8B95A1', tile: '#F2F4F6', up: '#089981', down: '#F04452', acc: '#2459ED' },
};
const money = v => (v > 0 ? '+' : v < 0 ? '-' : '') + '$' + Math.abs(v).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pct = v => v == null ? '-' : (v > 0 ? '+' : '') + v.toFixed(2) + '%';
function rr(ctx, x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function draw() {
  const c = $('cv'), x = c.getContext('2d'), W = 1080, H = 1350, t = TH[S.t] || TH.midnight;
  const g = x.createLinearGradient(0, 0, W, H); g.addColorStop(0, t.bg[0]); g.addColorStop(1, t.bg[1]); x.fillStyle = g; x.fillRect(0, 0, W, H);
  // 장식 원
  x.globalAlpha = .10; x.fillStyle = t.acc; x.beginPath(); x.arc(W - 120, 140, 260, 0, Math.PI * 2); x.fill(); x.beginPath(); x.arc(80, H - 60, 200, 0, Math.PI * 2); x.fill(); x.globalAlpha = 1;
  const F = (w, s) => `${w} ${s}px Pretendard, -apple-system, sans-serif`;
  // 로고
  const lx = 84, ly = 92;
  [[0, 26, .5], [30, 42, .75], [60, 60, 1]].forEach(([dx, h, a]) => { x.globalAlpha = a; x.fillStyle = t.acc; rr(x, lx + dx, ly + 60 - h, 20, h, 6); x.fill(); });
  x.globalAlpha = 1; x.fillStyle = t.text; x.font = F(800, 46); x.textBaseline = 'alphabetic'; x.fillText('Mung9_', lx + 100, ly + 52);
  const lw = x.measureText('Mung9_').width;
  x.fillStyle = t.sub; x.font = F(600, 30); x.fillText('Trading Journal', lx + 100 + lw + 22, ly + 50);
  // 기간
  x.font = F(600, 34); x.fillStyle = t.sub; x.fillText(D.period, 84, 268);
  x.font = F(700, 40); x.fillStyle = t.text; x.fillText('기간 순손익', 84, 330);
  // 큰 숫자
  const up = D.net >= 0, col = up ? t.up : t.down;
  const big = S.hide ? pct(D.roi) : money(D.net);
  let fs = 140; x.font = F(900, fs); while (x.measureText(big).width > W - 168 && fs > 70) { fs -= 6; x.font = F(900, fs); }
  x.fillStyle = col; x.fillText(big, 80, 330 + fs + 20);
  const yb = 330 + fs + 20;
  x.font = F(700, 40); x.fillStyle = t.sub;
  x.fillText(S.hide ? 'USDT 원금 대비 수익률' : `원금 대비 ${pct(D.roi)}`, 86, yb + 66);
  // 그래프
  let gy = yb + 112;
  if (S.chart && D.cum && D.cum.length > 1) {
    const gx = 84, gw = W - 168, gh = 220, lo = Math.min(0, ...D.cum), hi = Math.max(0, ...D.cum), r = (hi - lo) || 1;
    const px = i => gx + i / (D.cum.length - 1) * gw, py = v => gy + gh - (v - lo) / r * gh;
    x.strokeStyle = t.sub; x.globalAlpha = .35; x.setLineDash([8, 10]); x.lineWidth = 2; x.beginPath(); x.moveTo(gx, py(0)); x.lineTo(gx + gw, py(0)); x.stroke(); x.setLineDash([]); x.globalAlpha = 1;
    const ga = x.createLinearGradient(0, gy, 0, gy + gh); ga.addColorStop(0, col + '66'); ga.addColorStop(1, col + '00');
    x.beginPath(); D.cum.forEach((v, i) => i ? x.lineTo(px(i), py(v)) : x.moveTo(px(i), py(v))); x.lineTo(px(D.cum.length - 1), py(lo)); x.lineTo(gx, py(lo)); x.closePath(); x.fillStyle = ga; x.fill();
    x.beginPath(); D.cum.forEach((v, i) => i ? x.lineTo(px(i), py(v)) : x.moveTo(px(i), py(v))); x.strokeStyle = col; x.lineWidth = 7; x.lineJoin = 'round'; x.lineCap = 'round'; x.stroke();
    const lv = D.cum[D.cum.length - 1]; x.fillStyle = col; x.beginPath(); x.arc(px(D.cum.length - 1), py(lv), 12, 0, Math.PI * 2); x.fill();
    gy += gh + 44;
  } else gy += 20;
  // 지표 타일 2×2
  const tiles = [['승률', D.wr == null ? '-' : D.wr.toFixed(1) + '%', `${D.wins}승 ${D.losses}패`],
    ['청산 횟수', D.count + '회', `수익 ${D.wd}일 · 손실 ${D.ld}일`],
    ['Profit Factor', D.pf == null ? '∞' : D.pf.toFixed(2), '1 이상이면 수익 구조'],
    S.hide ? ['최대 수익 거래', D.bestPct == null ? '-' : pct(D.bestPct), '원금 대비'] : ['최대 수익 거래', D.best == null ? '-' : money(D.best), '한 번의 청산']];
  const tw = (W - 168 - 24) / 2, th = Math.max(130, Math.min(190, (H - 130 - gy - 24) / 2));
  tiles.forEach(([l, v, s], i) => {
    const tx = 84 + (i % 2) * (tw + 24), ty = gy + Math.floor(i / 2) * (th + 24);
    x.fillStyle = t.tile; rr(x, tx, ty, tw, th, 28); x.fill();
    x.fillStyle = t.sub; x.font = F(700, 30); x.fillText(l, tx + 34, ty + 56);
    x.fillStyle = t.text; x.font = F(850, 56); x.fillText(v, tx + 34, ty + 56 + 66);
    x.fillStyle = t.sub; x.font = F(600, 26); if (th >= 178) x.fillText(s, tx + 34, ty + th - 24);
  });
  // 바닥
  x.fillStyle = t.sub; x.font = F(600, 28); x.textAlign = 'right'; x.fillText('mung-s.streamlit.app', W - 84, H - 56); x.textAlign = 'left';
  x.fillText('Bitget · 수수료·펀딩비 반영', 84, H - 56);
}
function paint() {
  $('swHide').classList.toggle('on', S.hide); $('swChart').classList.toggle('on', S.chart);
  $('thm').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.t === S.t)); draw(); fit();
}
$('swHide').onclick = () => { S.hide = !S.hide; save(); paint(); };
$('swChart').onclick = () => { S.chart = !S.chart; save(); paint(); };
$('thm').querySelectorAll('button').forEach(b => b.onclick = () => { S.t = b.dataset.t; save(); paint(); });
const fname = () => `mung9_pnl_${D.start}_${D.end}.png`;
$('save').onclick = () => { const a = document.createElement('a'); a.download = fname(); a.href = $('cv').toDataURL('image/png'); document.body.appendChild(a); a.click(); a.remove(); };
$('share').onclick = () => $('cv').toBlob(async b => {
  const f = new File([b], fname(), { type: 'image/png' });
  try { const N = window.parent.navigator; if (N.canShare && N.canShare({ files: [f] })) { await N.share({ files: [f], title: 'Mung9_ 수익 카드' }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  $('save').click();
});
if (document.fonts && document.fonts.ready) document.fonts.ready.then(paint); paint(); setTimeout(paint, 1200);
</script>
</body>
</html>
