<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root {
  --top: #0F1219; --bar: #1E222D; --bg: #131722; --panel: #1A1E28; --field: #171B26; --line: rgba(255,255,255,0.07); --line2: #2A2E39;
  --hover: rgba(255,255,255,0.04); --text: #D1D4DC; --strong: #EDF0F5; --mid: #B2B5BE; --sub: #9598A1; --dim: #666A75;
  --up: #3CC3B4; --down: #F5646B; --accent: #2962FF; --star: #F7C948;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--text);
  font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: -0.01em; overflow: hidden; }
button, select, input { font-family: inherit; }
a { color: inherit; text-decoration: none; }
.up { color: var(--up) !important; } .down { color: var(--down) !important; }
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }

#app { display: flex; flex-direction: column; height: 100vh; }

/* SPLASH-CSS-START */
#splash { position: fixed; inset: 0; z-index: 100; background: radial-gradient(ellipse at 50% 40%, #182038 0%, #0D1018 70%); display: flex; align-items: center; justify-content: center; transition: opacity .5s ease, visibility .5s; }
#splash.hide { opacity: 0; visibility: hidden; }
.sp-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(41,98,255,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(41,98,255,.07) 1px, transparent 1px);
  background-size: 40px 40px; mask-image: radial-gradient(ellipse at center, #000 30%, transparent 75%); animation: sp-pan 8s linear infinite; }
@keyframes sp-pan { to { background-position: 40px 40px; } }
.sp-in { position: relative; display: flex; flex-direction: column; align-items: center; gap: 16px; }
.sp-logo { display: flex; align-items: flex-end; gap: 6px; height: 44px; filter: drop-shadow(0 0 14px rgba(41,98,255,.7)); }
.sp-logo i { display: block; width: 10px; border-radius: 3px; background: linear-gradient(#5B8CFF, #2962FF); animation: sp-pulse 1.1s ease-in-out infinite; transform-origin: bottom; }
.sp-logo i:nth-child(1) { height: 20px; animation-delay: 0s; } .sp-logo i:nth-child(2) { height: 31px; animation-delay: .15s; } .sp-logo i:nth-child(3) { height: 44px; animation-delay: .3s; }
@keyframes sp-pulse { 0%,100% { transform: scaleY(.55); opacity: .55; } 50% { transform: scaleY(1); opacity: 1; } }
.sp-name { font-size: 15px; letter-spacing: 6px; color: #9AA4BF; font-weight: 600; }
.sp-name b { color: #EDF0F5; font-weight: 800; }
.sp-candles { display: flex; align-items: center; gap: 7px; height: 70px; margin-top: 4px; }
.sp-candles span { position: relative; width: 8px; height: var(--h); border-radius: 2px; animation: sp-c 1.6s ease-in-out infinite; animation-delay: var(--d); }
.sp-candles span::before { content: ''; position: absolute; left: 3.5px; top: calc(var(--w) / -2); width: 1px; height: calc(100% + var(--w)); background: currentColor; opacity: .7; }
.sp-candles .g { background: #089981; color: #089981; box-shadow: 0 0 10px rgba(8,153,129,.5); }
.sp-candles .r { background: #F23645; color: #F23645; box-shadow: 0 0 10px rgba(242,54,69,.5); }
@keyframes sp-c { 0%,100% { transform: translateY(6px) scaleY(.7); opacity: .5; } 50% { transform: translateY(-6px) scaleY(1); opacity: 1; } }
.sp-bar { position: relative; margin-top: 10px; width: 220px; height: 3px; border-radius: 2px; background: rgba(255,255,255,.08); overflow: hidden; }
.sp-bar i { position: absolute; top: 0; left: -40%; width: 40%; height: 100%; border-radius: 2px; background: linear-gradient(90deg, transparent, #2962FF, #7FA3FF); animation: sp-run 1.1s ease-in-out infinite; }
@keyframes sp-run { to { left: 100%; } }
.sp-txt { font-size: 12.5px; color: #787B86; letter-spacing: .5px; }

/* SPLASH-CSS-END */
/* ① 맨 위 줄: 로고 · 화면 탭 · 매매 히스토리 */
#upper { display: flex; align-items: center; height: 34px; padding: 0 8px 0 12px; background: var(--top); flex-shrink: 0; gap: 4px; }
.logo { display: flex; align-items: center; gap: 7px; margin-right: 18px; color: var(--strong); font-size: 14px; font-weight: 700; white-space: nowrap; }
.logo svg { width: 18px; height: 18px; }
.wtab { display: flex; align-items: center; gap: 7px; height: 28px; margin-top: 6px; padding: 0 12px; border-radius: 7px 7px 0 0; color: var(--sub); font-size: 13px; cursor: pointer; border: 0; background: transparent; white-space: nowrap; }
.wtab:hover { color: var(--strong); }
.wtab.on { background: var(--bar); color: var(--strong); }
.wtab svg rect { fill: none; stroke: currentColor; stroke-width: 1.6; }
.wtab svg { width: 14px; height: 14px; }
.upper-right { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.linkbtn { display: flex; align-items: center; gap: 7px; height: 27px; padding: 0 14px; border-radius: 7px; border: 0; background: var(--accent); color: #fff; font-size: 13.5px; font-weight: 700; white-space: nowrap; cursor: pointer; }
.linkbtn:hover { background: #3D74FF; }
.linkbtn .short { display: none; }
.linkbtn.ghost { background: rgba(255,255,255,0.06); color: var(--strong); }
.linkbtn.ghost:hover { background: rgba(255,255,255,0.12); }
.linkbtn svg.i { width: 15px; height: 15px; stroke-width: 2; }

/* ② 종목 정보 줄 */
#bar { display: flex; align-items: center; height: 48px; padding: 0 8px; background: var(--bar); flex-shrink: 0; gap: 20px; color: var(--mid); font-size: 13px; }
#symBtn { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 10px 0 8px; border-radius: 7px; border: 0; background: transparent; color: var(--strong); cursor: pointer; flex-shrink: 0; }
#symBtn:hover { background: var(--hover); }
.coin { width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 10.5px; font-weight: 800; color: #fff; flex-shrink: 0; }
#symBtn .name { font-size: 15px; font-weight: 700; }
#symBtn .kind { font-size: 12px; color: var(--sub); }
#symBtn svg.i { width: 13px; height: 13px; color: var(--sub); }
.ms { display: flex; flex-direction: column; justify-content: center; gap: 2px; white-space: nowrap; }
.ms .lb { font-size: 12px; color: var(--sub); }
.ms .v { font-size: 13px; font-weight: 600; color: var(--text); }
.ms .u { font-size: 12px; font-weight: 600; color: var(--sub); margin-left: 3px; }
.price .p { font-size: 20px; font-weight: 600; color: var(--strong); line-height: 1.05; }
.price .c { font-size: 12px; display: flex; gap: 8px; }
.range { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--mid); }
.range .track { position: relative; width: 96px; height: 3px; background: rgba(255,255,255,0.12); border-radius: 2px; }
.range .knob { position: absolute; top: -4px; width: 2px; height: 11px; background: var(--strong); border-radius: 1px; transform: translateX(-1px); }
.fside { font-size: 12px; color: var(--sub); margin-left: 6px; font-weight: 400; }
#posChips { display: flex; gap: 6px; min-width: 0; overflow-x: auto; scrollbar-width: none; }
#posChips::-webkit-scrollbar { display: none; }
.chip { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 9px; border-radius: 6px; background: rgba(255,255,255,0.04); border: 1px solid var(--line); font-size: 12px; white-space: nowrap; flex-shrink: 0; cursor: pointer; }
.tag { font-size: 10px; font-weight: 700; padding: 2px 5px; border-radius: 4px; font-style: normal; }
.tag.long { background: rgba(60,195,180,0.15); color: var(--up); } .tag.short { background: rgba(245,100,107,0.15); color: var(--down); }
.bar-right { margin-left: auto; display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
.tbtn { display: flex; align-items: center; gap: 6px; height: 28px; padding: 0 9px; border-radius: 6px; border: 0; background: transparent; color: var(--mid); font-size: 13px; cursor: pointer; white-space: nowrap; position: relative; }
.tbtn:hover { background: var(--hover); color: var(--strong); }
.tbtn select { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.livedot { width: 6px; height: 6px; border-radius: 50%; background: var(--dim); }
.livedot.on { background: var(--up); box-shadow: 0 0 0 3px rgba(60,195,180,0.18); }

/* ③ 본문 */
#main { flex: 1; display: flex; min-height: 0; border-top: 1px solid var(--line2); }
#grid { flex: 1; display: grid; gap: 1px; background: var(--line2); min-width: 0; }
#grid.l1 { grid-template: 1fr / 1fr; }
#grid.l2 { grid-template: 1fr / 1fr 1fr; }
#grid.l3 { grid-template: 1fr 1fr / 2fr 1fr; }
#grid.l3 .cell:first-child { grid-row: 1 / 3; }
#grid.l4 { grid-template: 1fr 1fr / 1fr 1fr; }
.cell { background: var(--bg); position: relative; min-height: 0; min-width: 0; display: flex; flex-direction: column; }
.cell::after { content: ''; position: absolute; inset: 0; border: 1px solid transparent; pointer-events: none; z-index: 3; }
#grid:not(.l1) .cell.active::after { border-color: rgba(41,98,255,0.7); }
.phead { display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 10px; font-size: 12px; color: var(--mid); cursor: pointer; flex-shrink: 0; border-bottom: 1px solid var(--line2);
  white-space: nowrap; overflow: hidden; }
.phead * { white-space: nowrap; flex-shrink: 0; }
.phead .hint { flex-shrink: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.cell { container-type: inline-size; }
@container (max-width: 640px) { .phead .kind, .phead .hint { display: none; } .tfs button { padding: 0 5px; } }
@container (max-width: 470px) { .phead .pct { display: none; } .tfs { margin-left: auto; } }
#grid.l1.tv .phead { display: none; }
.tfs { display: flex; gap: 1px; margin-left: 6px; }
.tfs button { height: 20px; padding: 0 7px; border: 0; border-radius: 4px; background: transparent; color: var(--sub); font-size: 11.5px; font-weight: 600; cursor: pointer; }
.tfs button:hover { color: var(--strong); background: var(--hover); }
.tfs button.on { color: #fff; background: rgba(41,98,255,0.85); }
.engine { display: flex; gap: 2px; padding: 2px; background: rgba(255,255,255,0.04); border: 1px solid var(--line); border-radius: 7px; }
.engine button { height: 24px; padding: 0 9px; border: 0; border-radius: 5px; background: transparent; color: var(--sub); font-size: 12px; font-weight: 600; cursor: pointer; }
.engine button.on { background: rgba(255,255,255,0.1); color: var(--strong); }
.phead .coin { width: 15px; height: 15px; font-size: 8.5px; }
.phead b { font-size: 12.5px; font-weight: 600; color: var(--strong); }
.phead .hint { margin-left: auto; font-size: 11px; color: var(--dim); }
.cell.active .phead .hint { color: #7FA3FF; }
.pbody { position: relative; flex: 1; min-height: 0; }
.pbody > div { position: absolute; inset: 0; }

/* 오른쪽 패널 */
#panel { width: 240px; background: var(--panel); border-left: 1px solid var(--line2); display: flex; flex-direction: column; flex-shrink: 0; }
#app.panel-off #panel { display: none; }
.ph { display: flex; align-items: center; gap: 6px; height: 40px; padding: 0 10px 0 12px; }
.ph b { font-size: 14px; font-weight: 600; color: var(--strong); }
.ph span { font-size: 12px; color: var(--sub); }
.ph .x { margin-left: auto; width: 26px; height: 26px; border-radius: 5px; border: 0; background: transparent; color: var(--sub); cursor: pointer; display: flex; align-items: center; justify-content: center; }
.ph .x:hover { background: var(--hover); color: var(--strong); }
.cur { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; background: var(--panel); font-size: 13px; font-weight: 600; color: var(--strong); }
.cur .coin { width: 16px; height: 16px; font-size: 9px; }
.cur .c { font-size: 12px; }
.cur .t { margin-left: auto; font-size: 11px; color: var(--dim); font-weight: 400; }
.filter { padding: 8px 12px; }
.search { display: flex; align-items: center; gap: 7px; height: 28px; padding: 0 9px; background: var(--field); border: 1px solid var(--line); border-radius: 6px; }
.search:focus-within { border-color: var(--accent); }
.search input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--text); font-size: 13px; }
.search svg.i { width: 13px; height: 13px; color: var(--sub); }
.cols { display: grid; grid-template-columns: 1fr 70px 58px; height: 26px; align-items: center; padding: 0 12px; font-size: 12px; color: var(--sub); background: var(--panel); border-bottom: 1px solid var(--line); }
.cols span { cursor: pointer; user-select: none; } .cols span:not(:first-child) { text-align: right; }
.cols span.sorted { color: var(--text); font-weight: 600; }
.list { flex: 1; overflow-y: auto; }
.list::-webkit-scrollbar { width: 6px; } .list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
.sec { display: flex; align-items: center; gap: 6px; height: 30px; padding: 0 12px; background: var(--bar); font-size: 13px; font-weight: 600; color: var(--text); cursor: pointer; user-select: none; position: sticky; top: 0; z-index: 1; }
.sec span { font-size: 12px; font-weight: 400; color: var(--sub); }
.sec svg.i { width: 12px; height: 12px; color: var(--sub); transition: transform .15s; }
.sec.closed svg.i { transform: rotate(-90deg); }
.row { display: grid; grid-template-columns: 1fr 70px 58px; align-items: center; height: 32px; padding: 0 12px; cursor: pointer; font-size: 13px; }
.row:hover { background: var(--hover); }
.row.on { background: rgba(41,98,255,0.14); }
.row .s { display: flex; align-items: center; gap: 5px; min-width: 0; }
.row .s b { font-weight: 400; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .s .tag { padding: 1px 4px; font-size: 9.5px; }
.row .p { text-align: right; color: var(--text); }
.row .c { text-align: right; font-size: 12px; }
.star { width: 15px; height: 15px; border: 0; padding: 0; background: transparent; color: var(--dim); cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.star svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.8; }
.row:not(:hover) .star:not(.on) { color: transparent; }
.star.on { color: var(--star); } .star.on svg { fill: currentColor; }
.empty { padding: 30px 14px; text-align: center; color: var(--sub); font-size: 13px; }
.pos { margin: 8px 10px 0; padding: 11px 12px; border-radius: 8px; background: rgba(255,255,255,0.03); border: 1px solid var(--line); cursor: pointer; font-size: 12px; color: var(--sub); }
.pos:hover { border-color: rgba(255,255,255,0.18); }
.pos .t1 { display: flex; align-items: center; gap: 7px; margin-bottom: 8px; }
.pos .t1 b { font-size: 13.5px; color: var(--strong); font-weight: 600; }
.pos .pnl { font-size: 17px; font-weight: 700; margin-bottom: 8px; }
.pos .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; }
.pos .kv span:nth-child(even) { text-align: right; color: var(--text); }

/* 호가 · 체결 */
.obh { display: grid; grid-template-columns: 1fr 1fr 1fr; padding: 6px 12px; font-size: 11px; color: var(--sub); }
.obh span:not(:first-child), .obr span:not(:first-child) { text-align: right; }
.ob { flex-shrink: 0; }
.obr { position: relative; display: grid; grid-template-columns: 1fr 1fr 1fr; height: 21px; align-items: center; padding: 0 12px; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--text); }
.obr i { position: absolute; right: 0; top: 1px; bottom: 1px; }
.obr span { position: relative; }
.obmid { display: flex; align-items: baseline; gap: 10px; padding: 7px 12px; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); }
.obmid b { font-size: 16px; font-weight: 700; }
.obmid span { font-size: 11px; color: var(--sub); }
/* 실시간 청산 */
.liqsum { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 2px 12px 10px; }
.liqsum div { background: rgba(255,255,255,0.03); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; display: flex; flex-direction: column; gap: 3px; }
.liqsum span { font-size: 11px; color: var(--sub); }
.liqsum b { font-size: 15px; }
.liqsum em { grid-column: 1 / 3; font-style: normal; font-size: 11px; color: var(--dim); }
.segs { display: flex; gap: 2px; padding: 2px; background: var(--field); border: 1px solid var(--line); border-radius: 7px; }
.segs button { flex: 1; height: 24px; border: 0; border-radius: 5px; background: transparent; color: var(--sub); font-size: 12px; cursor: pointer; }
.segs button.on { background: rgba(255,255,255,0.08); color: var(--strong); font-weight: 600; }
.lqr { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; height: 30px; padding: 0 12px; font-size: 12.5px; }
.lqr b { font-weight: 500; color: var(--text); }
.lqr .t { font-size: 11px; color: var(--dim); }
.lqr.big { background: rgba(255,255,255,0.04); }
.lqr.big b, .lqr.big .num { font-weight: 700; }

/* 오른쪽 아이콘 레일 */
#rail { width: 56px; background: var(--bar); border-left: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 6px 0; gap: 4px; flex-shrink: 0; }
.rbtn { width: 48px; height: 48px; white-space: nowrap; letter-spacing: -0.03em; border-radius: 6px; border: 0; background: transparent; color: var(--mid); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 11px; }
.rbtn svg.i { width: 19px; height: 19px; }
.rbtn:hover { background: var(--hover); color: var(--strong); }
.rbtn.on { background: rgba(41,98,255,0.16); color: #8CAEFF; }
.rail-bottom { margin-top: auto; }
#panelToggle.on { background: transparent; color: var(--mid); }
#panelToggle.on:hover { background: var(--hover); color: var(--strong); }

/* ④ 하단 상태 줄 */
#status { display: flex; align-items: center; height: 28px; padding: 0 12px; background: var(--bg); border-top: 1px solid var(--line2); font-size: 12px; color: var(--mid); flex-shrink: 0; white-space: nowrap; overflow: hidden; gap: 16px; }
#status .k { color: var(--sub); }
#status b { color: var(--text); font-weight: 600; }
#status .sep { width: 1px; height: 12px; background: var(--line2); }
#status .right { margin-left: auto; display: flex; gap: 14px; padding-left: 12px; background: var(--bg); }

/* 좁은 화면용 종목 팝업 */
#pop { position: absolute; top: 80px; left: 8px; width: 300px; max-height: 70vh; background: var(--panel); border: 1px solid var(--line2); border-radius: 10px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.5); display: none; flex-direction: column; z-index: 20; overflow: hidden; }
#pop.open { display: flex; }

@media (max-width: 1250px) { .hide-lg { display: none !important; } }
@media (max-width: 1000px) { .hide-md { display: none !important; } }
@media (max-width: 860px) {
  #panel, #rail { display: none !important; }
  #grid.l2, #grid.l3, #grid.l4 { grid-template: 1fr / 1fr; }
  #grid .cell:not(.active) { display: none; }
  #grid.l3 .cell:first-child { grid-row: auto; }
  .hide-sm { display: none !important; }
  #bar { gap: 12px; }
  .wtab .lbl { display: none; }
  #upper { padding: 0 6px 0 10px; gap: 0; }
  .logo { margin-right: 8px; }
  .logo-t { display: none; }
  .wtab { padding: 0 9px; }
  .upper-right { gap: 4px; flex-shrink: 0; }
  .linkbtn { padding: 0 9px; font-size: 12.5px; gap: 5px; height: 26px; }
  .linkbtn .full { display: none; } .linkbtn .short { display: inline; }
  #symBtn .kind { display: none; }
  #status { gap: 10px; }
}
</style>
</head>
<body>
<!-- SPLASH-START --><div id="splash">
  <div class="sp-grid"></div>
  <div class="sp-in">
    <div class="sp-logo"><i></i><i></i><i></i></div>
    <div class="sp-name">MUNGGE <b>TERMINAL</b></div>
    <div class="sp-bar"><i></i></div>
    <div class="sp-txt" id="spTxt">Bitget 실시간 시세 연결 중</div>
  </div>
</div>
<!-- SPLASH-END -->
<div id="app">
  <div id="upper">
    <div class="logo"><svg viewBox="0 0 24 24"><rect x="3" y="12" width="4" height="9" rx="1.5" fill="#2962FF" opacity=".5"/><rect x="10" y="7" width="4" height="14" rx="1.5" fill="#2962FF" opacity=".75"/><rect x="17" y="3" width="4" height="18" rx="1.5" fill="#2962FF"/></svg><span class="logo-t">Mungge</span></div>
    <div id="tabs" style="display:flex;align-self:stretch;"></div>
    <div class="upper-right">
      <button class="linkbtn ghost" id="goMarket"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>시장</span></button>
      <button class="linkbtn" id="goHistory"><svg class="i" viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l3-4 3 2 5-6"/></svg><span class="full">매매 히스토리</span><span class="short">히스토리</span></button>
    </div>
  </div>

  <div id="bar">

// ---------- 차트 ----------
// ---------- 데이터 거래소 (OKX / Bitget) ----------
let CTVAL = {}; // OKX 계약 1개 = 코인 몇 개
const SRC = {
  okx: {
    name: 'OKX', tv: 'OKX', ws: 'wss://ws.okx.com:8443/ws/v5/public',
    id: s => s.replace('/', '-') + '-SWAP',
    bars: { '1': '1m', '3': '3m', '5': '5m', '15': '15m', '30': '30m', '60': '1H', '240': '4H', 'D': '1Dutc' },
    async candles(sym, iv) {
      const id = this.id(sym), j = await fetch(`https://www.okx.com/api/v5/market/candles?instId=${id}&bar=${this.bars[iv]}&limit=300`).then(r => r.json());
      const ct = CTVAL[id] || 1;
      return (j.data || []).map(r => ({ ms: +r[0], open: +r[1], high: +r[2], low: +r[3], close: +r[4], v: +r[6] || +r[5] * ct })).reverse();

    sub: (ch, id) => ({ channel: { trade: 'trades', book: 'books', ticker: 'tickers' }[ch], instId: id }),
    parse(m) {
      if (!m.arg || !m.data) return null;
      const ch = { trades: 'trade', books: 'book', tickers: 'ticker' }[m.arg.channel], id = m.arg.instId, ct = CTVAL[id] || 1;
      if (ch === 'trade') return { ch, id, live: true, items: [...m.data].reverse().map(x => ({ ts: +x.ts, px: +x.px, v: +x.sz * ct, buy: x.side === 'buy' })) };
      if (ch === 'book') { const d = m.data[0]; const f = a => (a || []).map(([p, q]) => [p, +q * ct]); return { ch, id, snap: m.action === 'snapshot', bids: f(d.bids), asks: f(d.asks) }; }

    name: 'Bitget', tv: 'BITGET', ws: 'wss://ws.bitget.com/v2/ws/public',

    parse(m) {

      if (ch === 'trade') return { ch, id, live: m.action !== 'snapshot', items: [...m.data].reverse().map(x => ({ ts: +x.ts, px: +x.price, v: +x.size, buy: x.side === 'buy' })) };
      if (ch === 'book') { const d = m.data[0]; const f = a => (a || []).map(([p, q]) => [p, +q]); return { ch, id, snap: true, bids: f(d.bids), asks: f(d.asks) }; }
      if (ch === 'ticker') return { ch, id, items: m.data.map(d => ({ id: d.instId || id, last: +d.lastPr, pct: d.change24h != null ? +d.change24h * 100 : null,

const SRC_KEY = state.src;
const X = SRC[SRC_KEY];
const ID2SYM = Object.fromEntries(DATA.symbols.map(s => [X.id(s), s]));
const tvSymbol = sym => `${X.tv}:${sym.replace('/', '')}.P`;
if (SRC_KEY === 'okx') fetch('https://www.okx.com/api/v5/public/instruments?instType=SWAP').then(r => r.json())
  .then(j => { for (const x of j.data || []) CTVAL[x.instId] = +x.ctVal || 1; }).catch(() => {});
const TFS = [['1', '1분'], ['3', '3분'], ['5', '5분'], ['15', '15분'], ['60', '1H'], ['240', '4H'], ['D', '1D']];
function wsSend(w, op, args) { for (let i = 0; i < args.length; i += 40) w.send(JSON.stringify({ op, args: args.slice(i, i + 40) })); }
function paneInfo(i) {
  const s = panes[i].sym, t = state.tk[s] || {};
  return `${coin(s)}<b>${base(s)}</b><span class="kind">무기한</span><span class="num ${cls(t.pct)}">${fmtPrice(t.last)}</span><span class="num pct ${cls(t.pct)}">${fmtPct(t.pct)}</span>`;

function paneHead(i) {

// ---------- 실시간 차트 (체결마다 바로 갱신) ----------
const BAR_MS = { '1': 60e3, '3': 180e3, '5': 300e3, '15': 900e3, '30': 1800e3, '60': 3600e3, '240': 14400e3, 'D': 86400e3 };
const KST_OFF = 9 * 3600; // 차트 시간 축을 한국 시간으로
const LC = {}; // pane 번호 → { chart, candle, vol, sym, ms, last, lines }
function destroyLive(i) {
  const c = LC[i]; if (!c) return;
  try { c.ro && c.ro.disconnect(); c.chart.remove(); } catch (e) {}
  delete LC[i]; syncTrades();
}
async function buildLive(i, body) {
  body.innerHTML = '<div></div>';
  const el = body.firstChild, sym = panes[i].sym, iv = BAR_MS[panes[i].iv] ? panes[i].iv : '3', ms = BAR_MS[iv];
  const chart = LightweightCharts.createChart(el, {
    autoSize: true,
    layout: { background: { type: 'solid', color: '#131722' }, textColor: '#9598A1', fontFamily: 'Pretendard, sans-serif', fontSize: 11 },
    grid: { vertLines: { color: 'rgba(42,46,57,0.45)' }, horzLines: { color: 'rgba(42,46,57,0.45)' } },
    rightPriceScale: { borderColor: '#2A2E39', scaleMargins: { top: 0.08, bottom: 0.22 } },
    timeScale: { borderColor: '#2A2E39', timeVisible: true, secondsVisible: false, rightOffset: 6, barSpacing: 7 },

  const candle = chart.addCandlestickSeries({ upColor: '#089981', downColor: '#F23645', borderVisible: false, wickUpColor: '#089981', wickDownColor: '#F23645' });
  const vol = chart.addHistogramSeries({ priceFormat: { type: 'volume' }, priceScaleId: 'vol', lastValueVisible: false, priceLineVisible: false });
  chart.priceScale('vol').applyOptions({ scaleMargins: { top: 0.82, bottom: 0 } });
  const st = LC[i] = { chart, candle, vol, sym, ms, last: null, ready: false, buf: [] };
  // 내 포지션 진입가 · 청산가 표시
  for (const p of DATA.positions.filter(p => p.symbol === sym)) {
    const c = p.side === 'LONG' ? '#089981' : '#F23645';
    candle.createPriceLine({ price: p.entry_price, color: c, lineWidth: 1, lineStyle: 2, axisLabelVisible: true, title: `${p.side === 'LONG' ? '롱' : '숏'} 진입` });
    if (p.liq_price > 0) candle.createPriceLine({ price: p.liq_price, color: '#F7A600', lineWidth: 1, lineStyle: 1, axisLabelVisible: true, title: '청산가' });
  }
  syncTrades();
  try {
    const rows = await X.candles(sym, iv);
    if (LC[i] !== st) return;
    const data = rows.map(r => ({ ...r, time: r.ms / 1000 + KST_OFF }));
    candle.setData(data.map(c => ({ time: c.time, open: c.open, high: c.high, low: c.low, close: c.close })));
    vol.setData(data.map(c => ({ time: c.time, value: c.v, color: c.close >= c.open ? 'rgba(8,153,129,0.35)' : 'rgba(242,54,69,0.35)' })));
    st.last = data.length ? { ...data[data.length - 1] } : null;
    st.ready = true;
    for (const t of st.buf) applyTrade(st, t); st.buf = [];
  } catch (e) {
    el.innerHTML = `<div class="empty">${X.name} 차트 데이터를 불러오지 못했어요</div>`;
  }
}
function applyTrade(st, t) {
  if (!st.ready) { st.buf.push(t); return; }
  let c = st.last;
  if (c && t.ts < c.ms) return; // 이미 지난 봉
  if (!c || t.ts >= c.ms + st.ms) {

let tws = null, tSubs = new Set();
function syncTrades() {
  const want = new Set(Object.values(LC).map(c => X.id(c.sym)));
  if (!tws || tws.readyState > 1) {
    if (!want.size) return;
    tws = new WebSocket(X.ws); tSubs = new Set();
    tws.onopen = () => { syncTrades(); tws._p = setInterval(() => { try { tws.send('ping'); } catch (e) {} }, 25000); };
    tws.onmessage = ev => {
      if (ev.data === 'pong') return;
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      const r = X.parse(m); if (!r || r.ch !== 'trade' || !r.live) return;
      for (const st of Object.values(LC)) if (X.id(st.sym) === r.id) for (const t of r.items) applyTrade(st, t);
    };
    tws.onclose = () => { clearInterval(tws && tws._p); setTimeout(() => { tws = null; syncTrades(); }, 2000); };
    return;
  }
  if (tws.readyState !== 1) return;
  const add = [...want].filter(x => !tSubs.has(x)), del = [...tSubs].filter(x => !want.has(x));
  if (add.length) wsSend(tws, 'subscribe', add.map(x => X.sub('trade', x)));
  if (del.length) wsSend(tws, 'unsubscribe', del.map(x => X.sub('trade', x)));
  add.forEach(x => tSubs.add(x)); del.forEach(x => tSubs.delete(x));
}

  const cur = curSym();
  const rows = liq.list.filter(x => state.liqFilter === 'all' || x.sym === cur).slice(0, 120);
  $('liqList').innerHTML = rows.map(x => `<div class="lqr ${x.usd >= 50000 ? 'big' : ''}"><span class="tag ${x.longLiq ? 'short' : 'long'}">${x.longLiq ? '롱' : '숏'}</span>
    <b>${base(x.sym)}</b><span class="num ${x.longLiq ? 'down' : 'up'}">$${fmtBig(x.usd)}</span><span class="t num">${hms(x.t)}</span></div>`).join('')
    || '<div class="empty">아직 청산이 없어요<br><span style="font-size:11.5px">청산이 생기면 바로 표시돼요</span></div>';
}
setInterval(() => { if (liq.dirty) { liq.dirty = false; renderLiq(); } else if (state.panel && state.view === 'liq') renderLiq(); }, 1000);

// ---------- 좁은 화면: 종목 팝업 ----------
$('symBtn').onclick = e => {
  e.stopPropagation();
  if (window.innerWidth > 860) { if (!state.panel || state.view !== 'watch') showView('watch'); setTimeout(() => { const q = $('q'); if (q) { q.focus(); q.select(); } }, 0); return; }
  const pop = $('pop'); pop.classList.toggle('open');
  if (pop.classList.contains('open')) {
    pop.innerHTML = `<div class="filter"><label class="search">${ICON.search}<input id="q2" placeholder="종목 찾기"></label></div><div class="list" id="plist"></div>`;
    const fill = q => { $('plist').innerHTML = watchListHtml(q); $('plist').querySelectorAll('.row').forEach(r => r.onclick = ev => { if (ev.target.closest('.star')) return; selectSym(r.dataset.s); }); };
    fill(''); $('q2').oninput = ev => fill(ev.target.value); $('q2').focus();
  }
};
document.addEventListener('click', e => { if (!$('pop').contains(e.target)) $('pop').classList.remove('open'); });

// ---------- 하단 상태 줄 ----------
function renderStatus() {
  $('krwTape').innerHTML = ['USDT', 'BTC', 'ETH', 'SOL', 'XRP'].map(b => {
    const u = state.up[b], v = u ? u.last : (b === 'USDT' ? DATA.krw : null);
    return `<span style="margin-right:14px"><span class="k">${b === 'USDT' ? '원화 ' : ''}${b}</span> <b class="num">${fmtKrw(v)}</b> <span class="num ${cls(u && u.pct)}">${u ? fmtPct(u.pct) : ''}</span></span>`;
  }).join('');
  $('usdTape').innerHTML = ['BTC/USDT', 'ETH/USDT', 'SOL/USDT', 'XRP/USDT'].map(s => {
    const t = state.tk[s] || {};
    return `<span style="margin-right:14px"><span class="k">${base(s)}</span> <b class="num">$${fmtPrice(t.last)}</b> <span class="num ${cls(t.pct)}">${fmtPct(t.pct)}</span></span>`;
  }).join('');
}

// ---------- 실시간 시세 ----------
let dirty = false;
// 무기한 시세 (차트와 같은 거래소)
let ws, wsPing, retry = 0;
function connectTicker() {
  try { ws = new WebSocket(X.ws); } catch (e) { return; }
  ws.onopen = () => {
    retry = 0; $('live').classList.add('on');
    wsSend(ws, 'subscribe', DATA.symbols.map(s => X.sub('ticker', X.id(s))));
    clearInterval(wsPing); wsPing = setInterval(() => { try { ws.send('ping'); } catch (e) {} }, 25000);
  };
  ws.onmessage = ev => {
    if (ev.data === 'pong') return;
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    const r = X.parse(m); if (!r || r.ch !== 'ticker') return;
    for (const d of r.items) {
      const s = ID2SYM[d.id]; if (!s || !d.last) continue;
      const p = state.tk[s] || {};
      state.tk[s] = { last: d.last, pct: d.pct ?? p.pct, high: d.high || p.high, low: d.low || p.low, qv: d.qv ?? p.qv, funding: p.funding, nft: p.nft };
    }
    dirty = true;
  };
  ws.onclose = () => { clearInterval(wsPing); $('live').classList.remove('on'); retry = Math.min(retry + 1, 6); setTimeout(connectTicker, 1000 * 2 ** retry); };
  ws.onerror = () => { try { ws.close(); } catch (e) {} };
}
// Bitget 펀딩비 (펀딩비만 Bitget 기준: 실제 거래하는 거래소)
let bgws, bgSubs = new Set();
function bitgetFundingSync() {
  if (!bgws || bgws.readyState !== 1) return;
  const want = new Set(panes.slice(0, state.layout).map(p => p.sym));
  const add = [...want].filter(s => !bgSubs.has(s));
  if (add.length) bgws.send(JSON.stringify({ op: 'subscribe', args: add.map(s => ({ instType: 'USDT-FUTURES', channel: 'ticker', instId: s.replace('/', '') })) }));
  add.forEach(s => bgSubs.add(s));
}
function connectBitgetFunding() {
  try { bgws = new WebSocket('wss://ws.bitget.com/v2/ws/public'); } catch (e) { return; }
  bgws.onopen = () => { bgSubs = new Set(); bitgetFundingSync(); bgws._p = setInterval(() => { try { bgws.send('ping'); } catch (e) {} }, 25000); };
  bgws.onmessage = ev => {
    if (ev.data === 'pong') return;
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (!m.data || !m.arg || m.arg.channel !== 'ticker') return;
    for (const d of m.data) {
      const s = DATA.byId[d.instId || m.arg.instId]; if (!s) continue;
      const p = state.bgf[s] || {};
      state.bgf[s] = { funding: d.fundingRate != null && d.fundingRate !== '' ? +d.fundingRate : p.funding, nft: d.nextFundingTime ? +d.nextFundingTime : p.nft };
    }
    dirty = true;
  };
  bgws.onclose = () => { clearInterval(bgws._p); setTimeout(connectBitgetFunding, 5000); };
}
setInterval(bitgetFundingSync, 2000);

// 업비트 원화 시세 (김프 · 하단 원화)
let uws, uretry = 0;
function connectUpbit() {
  const codes = Object.keys(state.up).map(b => 'KRW-' + b);
  if (!codes.length) return;
  try { uws = new WebSocket('wss://api.upbit.com/websocket/v1'); } catch (e) { return; }
  uws.binaryType = 'arraybuffer';
  uws.onopen = () => { uretry = 0; uws.send(JSON.stringify([{ ticket: 'mungge' }, { type: 'ticker', codes }, { format: 'SIMPLE' }])); };
  uws.onmessage = ev => {
    let m; try { m = JSON.parse(typeof ev.data === 'string' ? ev.data : new TextDecoder().decode(ev.data)); } catch (e) { return; }
    if (!m.cd) return;
    state.up[m.cd.replace('KRW-', '')] = { last: m.tp, pct: m.scr != null ? m.scr * 100 : null };
    dirty = true;
  };
  uws.onclose = () => { uretry = Math.min(uretry + 1, 6); setTimeout(connectUpbit, 1000 * 2 ** uretry); };
  uws.onerror = () => { try { uws.close(); } catch (e) {} };
}
setInterval(() => { if (!dirty) return; dirty = false; renderBar(); refreshHeads(); updateRows(); renderStatus(); }, 600);
// 변동% 정렬은 15초마다 다시 정렬
setInterval(() => { if (state.panel && state.view === 'watch' && state.sortKey !== 'none' && !(document.activeElement && document.activeElement.id === 'q')) renderList(); }, 15000);

// ---------- 높이: 브라우저 화면 꽉 채우기 ----------
function fitHeight() {
  try {
    const fe = window.frameElement; if (!fe) return;
    const h = Math.max(520, window.parent.innerHeight - fe.getBoundingClientRect().top);
    fe.style.height = h + 'px'; fe.height = h;
  } catch (e) {}
}
try { window.parent.addEventListener('resize', fitHeight); } catch (e) {}

// ---------- 매매 히스토리로 이동 (부모 페이지의 숨은 메뉴 링크를 대신 눌러줌) ----------
function goPage(key, path) {
  try {
    const link = window.parent.document.querySelector(`div[class*="st-key-hidden_nav_${key}"] a`);
    if (link) { link.click(); return; }
  } catch (e) {}
  try { window.top.location.href = path; } catch (e) { window.open(path, '_blank'); }
}
$('goHistory').onclick = () => goPage('history', '/');
$('goMarket').onclick = () => goPage('market', '/market');

// ---------- 차트를 클릭하면 그 차트가 선택됨 ----------
// TradingView 차트는 별도 iframe이라 클릭이 전달되지 않아서, 포커스가 어느 차트 iframe으로 갔는지 확인
function checkFocus() {
  const el = document.activeElement;
  if (!el || el.tagName !== 'IFRAME') return;
  const cell = el.closest('.cell'); if (!cell) return;
  const i = +cell.id.replace('cell_', '');
  if (!isNaN(i) && i !== state.active && i < state.layout) setActive(i);
}
window.addEventListener('blur', () => setTimeout(checkFocus, 0));
setInterval(checkFocus, 250);
document.getElementById('grid').addEventListener('mousedown', e => {
  const cell = e.target.closest('.cell'); if (cell) setActive(+cell.id.replace('cell_', ''));
});

// ---------- 로딩 화면 닫기: 첫 차트가 그려지거나 실시간 시세가 들어오면 ----------
let splashDone = false;
function hideSplash() { if (splashDone) return; splashDone = true; $('splash').classList.add('hide'); setTimeout(() => $('splash').remove(), 600); }
const spWatch = setInterval(() => {
  const c = LC[0];
  if ((c && c.ready) || (state.engine === 'tv' && document.querySelector('#grid iframe'))) { clearInterval(spWatch); setTimeout(hideSplash, 250); }
  else if ($('live').classList.contains('on')) $('spTxt').textContent = X.name + ' 차트 불러오는 중';
}, 150);
setTimeout(hideSplash, 6000);

// ---------- 시작 ----------
fitHeight(); setTimeout(fitHeight, 400);
$('spTxt').textContent = X.name + ' 실시간 시세 연결 중';
renderTabs(); renderEngine(); renderSrcSeg(); renderBar(); renderPanel(); renderStatus(); tickClock();
setInterval(tickClock, 1000);
buildGrid();
connectTicker(); connectUpbit(); connectLiq(); connectBinanceLiq(); connectBitgetFunding();
</script>
</body>
</html>
