<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root { --text: #191F28; --sub: #8B95A1; --mid: #4E5968; --line: #F2F4F6; --soft: #F7F8FA; --up: #089981; --down: #F04452; --blue: #3182F6;
  --card: #fff; --raise: #fff; --faint: #B0B8C1; --hover: #F9FAFB; --shadow: 0 2px 14px rgba(15,23,42,0.05); --sel: #EEF3FF; }
:root[data-theme="dark"] { --text: #ECEEF2; --sub: #8A93A2; --mid: #B4BBC6; --line: #232831; --soft: #20252D; --blue: #5B8DFF;
  --card: #171B22; --raise: #2A303A; --faint: #5F6774; --hover: #1C2129; --shadow: 0 2px 14px rgba(0,0,0,0.35); --sel: rgba(91,141,255,0.16); }
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: transparent; color: var(--text); font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; letter-spacing: -0.01em; }
.num { font-variant-numeric: tabular-nums; }
.up { color: var(--up) !important; } .down { color: var(--down) !important; } .flat { color: var(--sub) !important; }
.wrap { display: flex; flex-direction: column; gap: 18px; padding: 2px 2px 30px; }
.card { background: var(--card); border-radius: 20px; box-shadow: var(--shadow); padding: 22px 24px; min-width: 0; }
.ct { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; }
.ct b { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; white-space: nowrap; }
.ct span { text-align: right; }
.trisel { display: none; }
.ct span { font-size: 12.5px; color: var(--sub); }
.empty { color: var(--sub); font-size: 13px; text-align: center; padding: 26px 0; }
.empty::before { content: '⏳'; display: block; font-size: 22px; margin-bottom: 8px; }

/* 오늘의 시장 요약 */
.pulse { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; }
.pz { background: var(--card); border-radius: 18px; box-shadow: var(--shadow); padding: 16px 18px; min-width: 0; }
.pz > span { display: block; font-size: 12.5px; color: var(--sub); font-weight: 600; margin-bottom: 8px; }
.pz b { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.pz small { display: block; font-size: 12px; color: var(--sub); margin-top: 5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.breadth { display: flex; height: 6px; border-radius: 3px; overflow: hidden; gap: 2px; margin-top: 10px; }
.breadth i { display: block; height: 100%; }

/* 트렌딩 · 상승 · 하락 */
.tri { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; }
.mini { display: flex; flex-direction: column; }
.mr { display: grid; grid-template-columns: 18px 26px 1fr auto; gap: 10px; align-items: center; padding: 8px 6px; border-radius: 10px; cursor: pointer; }
.mr:hover { background: var(--hover); }
.mr .k { font-size: 12px; color: var(--sub); text-align: center; font-weight: 600; }
.mr img, .logo { width: 26px; height: 26px; border-radius: 50%; background: var(--soft); object-fit: cover; }
.mr .n { min-width: 0; }
.mr .n b { display: block; font-size: 14px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mr .n small { display: block; font-size: 11.5px; color: var(--sub); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mr .v { text-align: right; font-size: 13.5px; font-weight: 700; }
.mr .v small { display: block; font-size: 11.5px; color: var(--sub); font-weight: 500; margin-top: 1px; }

/* 코인 표 */
.tbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 10px; }
.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--soft); border-radius: 11px; overflow-x: auto; scrollbar-width: none; max-width: 100%; }
.seg::-webkit-scrollbar { display: none; }
.seg button { border: 0; background: transparent; padding: 7px 13px; border-radius: 9px; font-family: inherit; font-size: 13px; font-weight: 650; color: var(--sub); cursor: pointer; white-space: nowrap; }
.seg button.on { background: var(--raise); color: var(--text); box-shadow: 0 1px 4px rgba(15,23,42,0.08); }
.search { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px; border-radius: 11px; background: var(--soft); min-width: 220px; }
.search svg { width: 16px; height: 16px; color: var(--sub); flex-shrink: 0; }
.search input { border: 0; outline: 0; background: transparent; font-family: inherit; font-size: 14px; color: var(--text); width: 100%; }
.search input::placeholder { color: var(--sub); }
table { width: 100%; border-collapse: collapse; }
th { font-size: 12px; font-weight: 600; color: var(--sub); text-align: right; padding: 10px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none; position: sticky; top: 0; background: var(--card); }
th.l { text-align: left; } th.c { text-align: center; cursor: default; }
th.sorted { color: var(--text); }
th .ar { font-size: 10px; margin-left: 3px; }
td { padding: 11px 10px; font-size: 14px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
tbody tr { cursor: pointer; transition: background .12s; }
tbody tr:hover { background: var(--hover); }
tbody tr:last-child td { border-bottom: 0; }
td.l { text-align: left; } td.c { text-align: center; }
td.rk { color: var(--sub); font-size: 12.5px; width: 34px; text-align: center; }
td.st { width: 30px; padding-right: 0; }
.star { border: 0; background: transparent; cursor: pointer; padding: 2px; color: var(--faint); display: flex; }
.star svg { width: 16px; height: 16px; }
.star.on { color: #F5B800; }
.coin { display: flex; align-items: center; gap: 10px; min-width: 0; }
.coin b { font-size: 14.5px; font-weight: 700; }
.coin small { font-size: 12px; color: var(--sub); margin-left: 6px; }
.px b { font-weight: 700; }
.px small { display: block; font-size: 11.5px; color: var(--sub); margin-top: 2px; }
.flash-up { animation: fu .8s ease; } .flash-down { animation: fd .8s ease; }
@keyframes fu { 0% { background: rgba(8,153,129,.16); } 100% { background: transparent; } }
@keyframes fd { 0% { background: rgba(240,68,82,.16); } 100% { background: transparent; } }
.pct { font-weight: 650; }
.spark { width: 110px; height: 34px; display: block; margin-left: auto; }
.fund, .kimp { font-size: 13px; font-weight: 650; }
.more { display: block; width: 100%; margin-top: 12px; height: 42px; border: 0; border-radius: 12px; background: var(--soft); color: var(--mid); font-family: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer; }
.more:hover { color: var(--text); }
.tag { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 2px 6px; border-radius: 5px; background: var(--sel); color: var(--blue); margin-left: 6px; vertical-align: 1px; }

/* 뉴스 */
.news { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 28px; }
.nw { display: block; padding: 13px 4px; border-bottom: 1px solid var(--line); text-decoration: none; color: inherit; border-radius: 8px; }
.nw:hover .nt { color: var(--blue); }
.nw .nm { display: flex; gap: 8px; align-items: center; font-size: 11.5px; color: var(--sub); margin-bottom: 5px; }
.nw .src { font-weight: 700; color: var(--mid); }
.nw .nt { font-size: 14.5px; font-weight: 650; line-height: 1.45; transition: color .15s; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.nw .nd { font-size: 12.5px; color: var(--sub); margin-top: 4px; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; overflow: hidden; }

.hide-sm { } .only-sm { display: none; } .mseg { display: none; }
@media (max-width: 1000px) { .pulse { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tri { grid-template-columns: 1fr; }
  /* 뜨는 코인 · 상승 · 하락: 휴대폰에서는 탭으로 하나씩 */
  .trisel { display: flex; width: 100%; margin-bottom: -8px; } .trisel button { flex: 1; }
  .tri .mini { display: none; } .tri .mini.act { display: flex; } .news { grid-template-columns: 1fr; } .hide-md { display: none; } }
@media (max-width: 640px) {
  .card { padding: 18px 16px; border-radius: 18px; }
  .hide-sm { display: none; } .only-sm { display: table-cell; } .mseg { display: flex; margin-bottom: 6px; } .mseg button { padding: 6px 10px; font-size: 12px; }
  td { padding: 11px 6px; font-size: 13.5px; } th { padding: 9px 6px; }
  .coin small { display: none; }
  .search { min-width: 0; flex: 1; }
  .spark { width: 70px; }
  .pz b { font-size: 19px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="pulse" id="pulse"></div>

  <div class="seg trisel" id="triSel"><button data-i="0" class="on">🔥 뜨는 코인</button><button data-i="1">🚀 상승</button><button data-i="2">📉 하락</button></div>
  <div class="tri">
    <div class="card mini act"><div class="ct"><b>🔥 지금 뜨는 코인</b><span>CoinGecko 검색 순위</span></div><div id="trend"></div></div>
    <div class="card mini"><div class="ct"><b>🚀 24시간 상승</b><span>시총 상위 200개 중</span></div><div id="gain"></div></div>
    <div class="card mini"><div class="ct"><b>📉 24시간 하락</b><span>시총 상위 200개 중</span></div><div id="lose"></div></div>
  </div>

  <div class="card">
    <div class="ct"><b>전체 코인</b><span id="liveNote">시가총액 순 · 가격은 Bitget 실시간</span></div>
    <div class="tbar">
      <div class="seg" id="tabs"><button data-t="all" class="on">전체</button><button data-t="fav">★ 즐겨찾기</button><button data-t="bitget">Bitget 선물</button><button data-t="up">상승</button><button data-t="down">하락</button></div>
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="q" placeholder="코인 이름·심볼 검색"></label>
    </div>
    <div class="seg mseg" id="mseg"><button data-m="h24" class="on">24시간</button><button data-m="d7">7일</button><button data-m="kimp">김프</button><button data-m="fund">펀딩비</button><button data-m="mcap">시총</button></div>
    <div style="overflow-x:auto;">
      <table>
        <thead><tr>
          <th class="c"></th><th data-k="rank" class="c hide-sm">#</th><th data-k="name" class="l">코인</th><th data-k="price">가격</th>
          <th data-k="h1" class="hide-md">1시간</th><th data-k="h24" class="hide-sm">24시간</th><th class="only-sm" id="mcHead" data-k="h24">24시간</th><th data-k="d7" class="hide-sm">7일</th>
          <th class="c hide-md">7일 차트</th><th data-k="mcap" class="hide-sm">시가총액</th><th data-k="vol" class="hide-md">거래량(24h)</th>
          <th data-k="fund" class="hide-md">펀딩비</th><th data-k="kimp" class="hide-sm">김프</th>
        </tr></thead>
        <tbody id="tb"></tbody>
      </table>
    </div>
    <button class="more" id="more">더 보기</button>
  </div>

  <div class="card"><div class="ct"><b>📰 코인 뉴스</b><span>블록미디어 · 토큰포스트</span></div><div class="news" id="news"></div></div>
</div>

<script>
const DATA = __DATA__;
const $ = id => document.getElementById(id);
const P = window.parent, PD = P.document;

// ---------- 라이트/다크 (사이트 설정을 따라감) ----------
const MQ = matchMedia('(prefers-color-scheme: dark)');
function siteDark() { let t = null; try { t = PD.documentElement.getAttribute('data-mg-theme'); } catch (e) {} return t ? t === 'dark' : MQ.matches; }
function syncTheme() { document.documentElement.setAttribute('data-theme', siteDark() ? 'dark' : 'light'); }
syncTheme();
try { new MutationObserver(syncTheme).observe(PD.documentElement, { attributes: true, attributeFilter: ['data-mg-theme'] }); } catch (e) {}
MQ.addEventListener && MQ.addEventListener('change', syncTheme);

// ---------- 내용 길이에 맞춰 칸 높이 자동 조절 ----------
function _fitFrame(fe, h) { fe.style.height = h + 'px'; fe.height = h; let n = fe.parentElement; for (let i = 0; i < 4 && n; i++, n = n.parentElement) { n.style.height = h + 'px'; n.style.minHeight = h + 'px'; n.style.flex = '0 0 ' + h + 'px'; if (n.getAttribute && n.getAttribute('data-testid') === 'stElementContainer') break; } }
function fit() { try { const h = Math.ceil(document.body.getBoundingClientRect().height) + 4, fe = window.frameElement; if (fe && (Math.abs(fe.offsetHeight - h) > 2 || (fe.parentElement && Math.abs(fe.parentElement.offsetHeight - h) > 2))) _fitFrame(fe, h); } catch (e) {} }
new ResizeObserver(fit).observe(document.body); setInterval(fit, 1500);

// ---------- 숫자 표시 ----------
const usdkrw = DATA.usdkrw || 1400;
function fmtP(v) {
  if (v == null || isNaN(v)) return '-';
  const a = Math.abs(v), d = a >= 1000 ? 2 : a >= 1 ? 3 : a >= 0.01 ? 5 : 8;
  return '$' + v.toLocaleString('en-US', { minimumFractionDigits: Math.min(d, 2), maximumFractionDigits: d });
}
function fmtBig(v, cur = '$') {
  if (v == null || isNaN(v)) return '-';
  const a = Math.abs(v);
  if (cur === '₩') return a >= 1e12 ? '₩' + (v / 1e12).toLocaleString('ko-KR', { maximumFractionDigits: 0 }) + '조' : a >= 1e8 ? '₩' + (v / 1e8).toFixed(0) + '억' : '₩' + Math.round(v).toLocaleString();
  return a >= 1e12 ? '$' + (v / 1e12).toFixed(2) + 'T' : a >= 1e9 ? '$' + (v / 1e9).toFixed(2) + 'B' : a >= 1e6 ? '$' + (v / 1e6).toFixed(1) + 'M' : '$' + Math.round(v).toLocaleString();
}
const fmtKrw = v => v == null ? '' : '₩' + (v >= 100 ? Math.round(v).toLocaleString() : v.toLocaleString('ko-KR', { maximumFractionDigits: 2 }));
const pc = v => v == null || isNaN(v) ? '<span class="flat">-</span>' : `<span class="${v > 0 ? 'up' : v < 0 ? 'down' : 'flat'}">${v > 0 ? '+' : ''}${v.toFixed(2)}%</span>`;
const cls = v => v > 0 ? 'up' : v < 0 ? 'down' : 'flat';
const esc = s => String(s || '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ago = ts => { const m = Math.max(0, (Date.now() / 1000 - ts) / 60); return m < 60 ? Math.round(m) + '분 전' : m < 1440 ? Math.round(m / 60) + '시간 전' : Math.round(m / 1440) + '일 전'; };
function spark(arr, up) {
  if (!arr || arr.length < 2) return '';
  const lo = Math.min(...arr), hi = Math.max(...arr), w = 110, h = 34, r = hi - lo || 1;
  const pts = arr.map((v, i) => `${(i / (arr.length - 1) * w).toFixed(1)},${(h - 3 - (v - lo) / r * (h - 6)).toFixed(1)}`).join(' ');
  const c = up ? 'var(--up)' : 'var(--down)';
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" style="stroke:${c}" stroke-width="1.6" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}

// ---------- 데이터 합치기 ----------
let COINS = [];
const FUND = DATA.funding || {}, UP = DATA.upbit || {};
function build(markets) {
  COINS = markets.filter(c => c.price != null).map(c => {
    const bg = FUND[c.sym] !== undefined;
    return Object.assign({}, c, { bitget: bg, fund: bg ? FUND[c.sym] : null });
  });
  for (const c of COINS) calcKimp(c);
}
function calcKimp(c) {
  const u = UP[c.sym];
  c.krw = u ? u.last : (c.price * usdkrw);
  c.kimp = (u && c.price && usdkrw) ? (u.last / (c.price * usdkrw) - 1) * 100 : null;
}

// ---------- 즐겨찾기 ----------
let FAV = new Set(['BTC', 'ETH']);
try { const f = JSON.parse(localStorage.getItem('mung_coin_fav') || 'null'); if (Array.isArray(f)) FAV = new Set(f); } catch (e) {}
const saveFav = () => { try { localStorage.setItem('mung_coin_fav', JSON.stringify([...FAV])); } catch (e) {} };
const STAR = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3.2l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17.2 6.6 20.1l1-6.1L3.2 9.7l6.1-.9z"/></svg>';

// ---------- 요약 · 트렌딩 · 상승/하락 ----------
function renderPulse() {
  const v = COINS.filter(c => c.h24 != null);
  const up = v.filter(c => c.h24 > 0).length, dn = v.filter(c => c.h24 < 0).length;
  const avg = v.length ? v.reduce((s, c) => s + c.h24, 0) / v.length : null;
  const btc = COINS.find(c => c.sym === 'BTC'), eth = COINS.find(c => c.sym === 'ETH');
  const mcap = COINS.reduce((s, c) => s + (c.mcap || 0), 0);
  $('pulse').innerHTML = `
    <div class="pz"><span>상승 · 하락 코인</span><b><span class="up">${up}</span> <span style="color:var(--faint);font-weight:600">/</span> <span class="down">${dn}</span></b>
      <div class="breadth"><i style="flex:${up};background:var(--up)"></i><i style="flex:${dn};background:var(--down)"></i></div></div>
    <div class="pz"><span>평균 등락률 (24h)</span><b class="${cls(avg)}">${avg == null ? '-' : (avg > 0 ? '+' : '') + avg.toFixed(2) + '%'}</b><small>시가총액 상위 ${v.length}개 코인</small></div>
    <div class="pz"><span>비트코인</span><b class="num" id="pzBtc">${btc ? fmtP(btc.price) : '-'}</b><small>${btc ? pc(btc.h24) + ' · 김프 ' + (btc.kimp == null ? '-' : (btc.kimp > 0 ? '+' : '') + btc.kimp.toFixed(2) + '%') : ''}</small></div>
    <div class="pz"><span>상위 코인 시가총액</span><b class="num">${fmtBig(mcap)}</b><small>${fmtBig(mcap * usdkrw, '₩')}${eth ? ' · ETH ' + fmtP(eth.price) : ''}</small></div>`;
}
function miniRow(c, i, right) {
  return `<div class="mr" data-id="${esc(c.id)}"><span class="k">${i + 1}</span>${c.img ? `<img src="${esc(c.img)}" loading="lazy">` : '<span class="logo"></span>'}
    <div class="n"><b>${esc(c.sym)}</b><small>${esc(c.name)}</small></div><div class="v">${right}</div></div>`;
}
function renderTri() {
  const tr = (DATA.trending || []);
  $('trend').innerHTML = tr.length ? tr.slice(0, 5).map((c, i) => {
    const m = COINS.find(x => x.id === c.id);
    return miniRow(c, i, `${pc(m ? m.h24 : c.h24)}<small>${c.rank ? '시총 ' + c.rank + '위' : '순위 없음'}</small>`);
  }).join('') : '<div class="empty">트렌딩 정보를 불러오지 못했어요</div>';
  const v = COINS.filter(c => c.h24 != null);
  const g = [...v].sort((a, b) => b.h24 - a.h24).slice(0, 5), l = [...v].sort((a, b) => a.h24 - b.h24).slice(0, 5);
  $('gain').innerHTML = g.map((c, i) => miniRow(c, i, `${pc(c.h24)}<small>${fmtP(c.price)}</small>`)).join('') || '<div class="empty">-</div>';
  $('lose').innerHTML = l.map((c, i) => miniRow(c, i, `${pc(c.h24)}<small>${fmtP(c.price)}</small>`)).join('') || '<div class="empty">-</div>';
  document.querySelectorAll('.mr').forEach(el => el.onclick = () => openCoin(el.dataset.id));
}

$('triSel').querySelectorAll('button').forEach(b => b.onclick = () => {
  $('triSel').querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));
  document.querySelectorAll('.tri .mini').forEach((m, i) => m.classList.toggle('act', i === +b.dataset.i));
});

// ---------- 표 ----------
let tab = 'all', q = '', sortK = 'rank', sortD = 1, shown = 15;
function list() {
  let a = COINS;
  if (tab === 'fav') a = a.filter(c => FAV.has(c.sym));
  else if (tab === 'bitget') a = a.filter(c => c.bitget);
  else if (tab === 'up') a = a.filter(c => c.h24 > 0);
  else if (tab === 'down') a = a.filter(c => c.h24 < 0);
  if (q) { const s = q.toLowerCase(); a = a.filter(c => c.sym.toLowerCase().includes(s) || (c.name || '').toLowerCase().includes(s)); }
  let k = sortK, d = sortD;
  if (tab === 'up' && sortK === 'rank') { k = 'h24'; d = -1; }
  if (tab === 'down' && sortK === 'rank') { k = 'h24'; d = 1; }
  return [...a].sort((x, y) => {
    const vx = k === 'name' ? (x.name || '') : x[k], vy = k === 'name' ? (y.name || '') : y[k];
    if (vx == null) return 1; if (vy == null) return -1;
    return (k === 'name' ? String(vx).localeCompare(String(vy)) : vx - vy) * d;
  });
}
function rowHtml(c) {

// ---------- 실시간 가격 (Bitget 선물 체결가) ----------
function connectLive() {
  const syms = COINS.filter(c => c.bitget).map(c => c.sym);
  if (!syms.length) return;
  let ws; try { ws = new WebSocket('wss://ws.bitget.com/v2/ws/public'); } catch (e) { return; }
  ws.onopen = () => {
    const args = syms.map(s => ({ instType: 'USDT-FUTURES', channel: 'ticker', instId: s + 'USDT' }));
    for (let i = 0; i < args.length; i += 40) ws.send(JSON.stringify({ op: 'subscribe', args: args.slice(i, i + 40) }));
    ws._p = setInterval(() => { try { ws.send('ping'); } catch (e) {} }, 25000);
  };
  ws.onmessage = ev => {
    if (ev.data === 'pong') return;
    let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
    if (!m.data || !m.arg || m.arg.channel !== 'ticker') return;
    for (const d of m.data) {
      const sym = String(d.instId || m.arg.instId).replace(/USDT$/, ''), c = COINS.find(x => x.sym === sym && x.bitget);
      if (!c) continue;
      const px = +d.lastPr; if (!px) continue;
      const old = c.price; c.price = px; if (d.change24h != null) c.h24 = +d.change24h * 100; calcKimp(c);
      const cell = document.querySelector(`td[data-px="${CSS.escape(sym)}"]`);
      if (cell) {
        cell.innerHTML = `<b>${fmtP(px)}</b><small>${fmtKrw(c.krw)}</small>`;
        if (old && px !== old) { cell.classList.remove('flash-up', 'flash-down'); void cell.offsetWidth; cell.classList.add(px > old ? 'flash-up' : 'flash-down'); }
      }
      const pcell = document.querySelector(`td[data-pc="${CSS.escape(sym)}"]`); if (pcell) pcell.innerHTML = pc(c.h24);
      const mcl = document.querySelector(`td[data-mc="${CSS.escape(sym)}"]`); if (mcl && (mcol === 'h24' || mcol === 'kimp')) mcl.innerHTML = mcell(c);
      if (sym === 'BTC' && $('pzBtc')) $('pzBtc').textContent = fmtP(px);
      if (drawer.sym === sym) updateDrawerPrice(c);
    }
  };
  ws.onclose = () => { clearInterval(ws._p); setTimeout(connectLive, 3000); };
}

  dr.querySelector('#mg-al-add').onclick = () => { if (A.add(c.sym, inp.value)) { inp.value = ''; draw(); } };
  inp.onkeydown = e => { if (e.key === 'Enter') dr.querySelector('#mg-al-add').click(); };
  dr.querySelectorAll('.al-q button').forEach(b => b.onclick = () => { if (c.price) inp.value = +(c.price * (1 + +b.dataset.p / 100)).toPrecision(6); inp.focus(); });
  if (P._mgAlDraw) P.removeEventListener('mg-alerts-changed', P._mgAlDraw);
  P._mgAlDraw = draw; P.addEventListener('mg-alerts-changed', draw);
  draw();
}
// 차트 터미널에서 이 코인 열기: 차트 화면이 기억하는 '지금 보는 칸'의 종목을 바꾸고 이동
function openInChart(sym) {
  try {
    const KEY = 'mung_chart_v3', s = JSON.parse(localStorage.getItem(KEY) || '{}');
    const panes = Array.isArray(s.panes) && s.panes.length ? s.panes : [{ sym: sym + '/USDT', iv: '3' }];
    const a = Number.isInteger(s.active) && panes[s.active] ? s.active : 0;
    panes[a] = Object.assign({}, panes[a], { sym: sym + '/USDT' });
    s.panes = panes; s.active = a; localStorage.setItem(KEY, JSON.stringify(s));
  } catch (e) {}
  closeCoin();
  const link = PD.querySelector('div[class*="st-key-hidden_nav_chart"] a');
  if (link) link.click();
}

// ---------- 시작 ----------
async function start() {
  let mk = DATA.markets || [];
  if (!mk.length) {
    // 서버에서 못 받았으면 브라우저가 직접 CoinGecko에서 받아옴
    try {
      const r = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=200&page=1&sparkline=true&price_change_percentage=1h,24h,7d').then(r => r.json());
      mk = (r || []).map(c => { const sp = (c.sparkline_in_7d || {}).price || [], step = Math.max(1, Math.floor(sp.length / 42));
        return { id: c.id, sym: (c.symbol || '').toUpperCase(), name: c.name, img: c.image, rank: c.market_cap_rank, price: c.current_price, mcap: c.market_cap, fdv: c.fully_diluted_valuation,
          vol: c.total_volume, h1: c.price_change_percentage_1h_in_currency, h24: c.price_change_percentage_24h_in_currency, d7: c.price_change_percentage_7d_in_currency,
          high24: c.high_24h, low24: c.low_24h, ath: c.ath, athc: c.ath_change_percentage, athd: (c.ath_date || '').slice(0, 10), circ: c.circulating_supply, total: c.total_supply, max: c.max_supply,
          spark: sp.filter((_, i) => i % step === 0).slice(-42) }; });
    } catch (e) { mk = []; }
  }
  build(mk);
  if (!COINS.length) { $('more').style.display = 'none'; } if (!COINS.length) $('tb').innerHTML = '<tr><td colspan="12" class="c" style="padding:40px 0;color:var(--sub)">코인 목록을 불러오지 못했어요 · 잠시 뒤 새로고침해 주세요</td></tr>';
  renderPulse(); renderTri(); if (COINS.length) renderTable(); renderNews(); fit();
  connectLive();
}
start();
</script>
